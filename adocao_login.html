<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>adoção_animais</title>
    <link rel="icon" type="image/png" href="foto/logopet.png" />
    <style>
      header {
        display: flex;
        background-color: rgb(255, 255, 255);
        justify-content: space-between;
        padding: 20px;
        align-items: center;
      }
      header img {
        height: 110px;
      }
      nav a {
        color: #37474f;
        font-weight: bold;
        font-size: 38px;
        text-decoration: none;
      }
      nav a:hover {
        color: #0d47a1;
        text-decoration: underline;
        text-decoration-color: rgb(0, 140, 255);
        text-decoration-thickness: 2px;
        text-underline-offset: 5px;
      }
      nav {
        display: flex;
        gap: 30px;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #2196f3;
      }
      main {
        min-width: 100vh;
        background-color: #2196f3;

        display: flex;
        justify-content: center;
        align-items: center;
      }
      .login {
        width: 350px;
        height: 470px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.45);
        background-color: #398ef0;

        text-align: center;
        display: grid;

        margin-top: 155px;
        font-size: 20px;
      }
      h1,
      h2 {
        color: #0d2b45;
      }

      button {
        border-radius: 20px;
        margin-top: 20px;
        border: 2px solid #538cce;

        background-color: #b3d4f5;
      }
      a {
        text-decoration: none;
        color: #0d2b45;
        font-size: 25px;
      }
      label {
        font-size: 30px;
        color: #24546b;
      }
      input {
        background-color: #f5faff;
        border: 2px solid #42a5f5;
      }
    </style>
  </head>
  <header>
    <h1><img src="foto/logopet.png" alt="Pet Feliz" /></h1>

    <nav>
      <a href="pg_inicio.html">Início</a>
      <a href="cadastro.html">cadastrar animal</a>
      <a href="adocao_login.html">login</a>
    </nav>
  </header>
  <body>
    <main>
      <div class="login">
        <h1>🐾Pet Feliz</h1>
        <h2>bem vindo(a) ao Pet feliz</h2>
        <label>E-mail</label>
        <input type="email" />
        <label>Senha</label>
        <input type="password" />
        <button><a href="pg_inicio.html">Entrar</a></button>
      </div>
    </main>
  </body>
</html>
